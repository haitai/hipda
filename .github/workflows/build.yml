
name: Build HiPDA APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-30" \
            "build-tools;30.0.3"

      - name: Prepare Fabric configuration
        run: |
          if [ -f hipda/fabric.properties.example ]; then
            cp hipda/fabric.properties.example \
               hipda/fabric.properties
          elif [ -f hipad/fabric.properties.example ]; then
            cp hipad/fabric.properties.example \
               hipad/fabric.properties
          else
            echo "Fabric example file not found; checking build requirements."
            find . -name 'fabric.properties*' -print
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hipda-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
